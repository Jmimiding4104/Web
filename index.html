<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <title>篩檢預先填寫系統</title>
  </head>
  <body>
    <header class="mt-3 d-flex justify-content-center">
      <h1>資料預填系統</h1>
    </header>
    <section class="mx-3">
      <div class="form-floating mb-3">
        <input
          type="text"
          class="form-control"
          id="floatingInput"
          placeholder="請輸入姓名"
        />
        <label for="floatingInput">姓名</label>
      </div>
      <div class="form-floating mb-3">
        <input
          type="text"
          class="form-control"
          id="floatingPassword"
          placeholder="請輸入身分證字號"
        />
        <label for="floatingPassword">身分證字號</label>
      </div>
      <div class="form-floating mb-3">
        <input
          type="text"
          class="form-control"
          id="floatingPassword"
          placeholder="請輸入生日"
        />
        <label for="floatingPassword">生日</label>
      </div>
      <div class="form-floating mb-3">
        <input
          type="text"
          class="form-control"
          id="floatingPassword"
          placeholder="請輸入住址"
        />
        <label for="floatingPassword">住址(可收到信件通知的地址)</label>
      </div>
      <div class="form-floating">
        <select
          class="form-select"
          id="floatingSelect"
          aria-label="Floating label select example"
        >
          <option selected>請選擇您的學歷</option>
          <option value="無">無</option>
          <option value="小學">小學</option>
          <option value="國中">國(初)中</option>
          <option value="高中">高中(職)</option>
          <option value="專科">專科、大學</option>
          <option value="研究所以上">研究所以上</option>
        </select>
        <label for="floatingSelect">學歷</label>
      </div>
    </section>
  </body>
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"
  ></script>
</html>
